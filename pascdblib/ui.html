<title>pascdb</title>
<style>
:root {
	--bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #d9d9de;
	--accent: #1f5fbf; --cur: #fff3b0; --curline: #e8b800; --bad: #c62828; --ptr: #2e7d32;
	--rec: #eef3fb; --arr: #f3f0fa; --heap: #eef7ef; --frame: #fafafa; --chip: #eceff3; --chg: #ffd9a8;
	--mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #18181b; --panel: #222226; --ink: #e8e8ea; --muted: #9a9aa2; --line: #3a3a40;
		--accent: #6ea8ff; --cur: #4a4220; --curline: #e8b800; --bad: #ff6b6b; --ptr: #6fcf73;
		--rec: #1f2a3a; --arr: #2a2438; --heap: #1f3323; --frame: #26262b; --chip: #303036; --chg: #6b4a12;
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif;
	height: 100vh; display: flex; flex-direction: column; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel);
	border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px;
	background: var(--chip); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
#status { margin-left: auto; color: var(--muted); }
#status b { color: var(--ink); }
main { flex: 1; display: grid; grid-template-columns: minmax(300px, 40%) 1fr; min-height: 0; }
#left { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
#source { flex: 1; overflow: auto; font: 13px/1.5 var(--mono); background: var(--panel); padding: 6px 0; }
.ln { display: flex; white-space: pre; }
.ln .no { width: 3.5em; text-align: right; padding-right: 8px; color: var(--muted); cursor: pointer;
	user-select: none; flex: none; }
.ln .no.bp { color: #fff; background: var(--bad); border-radius: 0 8px 8px 0; }
.ln .tx { flex: 1; tab-size: 8; -moz-tab-size: 8; }
.ln.cur { background: var(--cur); }
.ln.cur .no { color: var(--ink); font-weight: 700; }
.colmark { background: var(--curline); color: #000; border-radius: 2px; }
#io { border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column;
	height: 34%; min-height: 120px; }
#io h2, .tabs { font-size: 12px; margin: 0; padding: 4px 10px; color: var(--muted); text-transform: uppercase;
	letter-spacing: .05em; }
#out { flex: 1; overflow: auto; margin: 0; padding: 4px 10px; font: 13px/1.4 var(--mono); white-space: pre-wrap; }
#out .msg { color: var(--bad); }
#inrow { display: flex; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--line); }
#inrow input { flex: 1; font: 13px var(--mono); padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px;
	background: var(--bg); color: var(--ink); }
#inrow.waiting input { border-color: var(--curline); box-shadow: 0 0 0 2px var(--curline); }
#right { display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 4px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.tabs button { border-radius: 6px 6px 0 0; border-bottom: none; text-transform: none; letter-spacing: 0; font-size: 13px; }
.tabs button.on { background: var(--panel); border-color: var(--accent); color: var(--accent); }
.pane { flex: 1; overflow: auto; position: relative; display: none; padding: 10px; }
.pane.on { display: block; }
#data { display: none; }
#data.on { display: block; }
.datatools { margin-bottom: 8px; }
.datatools button { font-size: 12px; padding: 2px 8px; }
.sc.long { cursor: pointer; }
.infile { margin-bottom: 14px; }
.infile h4 { margin: 0 0 4px; font-size: 13px; }
.infile pre { margin: 0; font: 13px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; background: var(--panel);
	border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-height: 60vh; overflow: auto; tab-size: 8; }
.infile .done { color: var(--muted); }
.infile .here { background: var(--curline); color: #000; border-radius: 2px; box-shadow: 0 0 0 1px var(--curline); }
.infile .eol { color: var(--muted); font-size: 10px; }
.refcopy { opacity: 0.55; filter: saturate(0.4); border-left: 3px dashed var(--accent); padding-left: 4px; }
#datacols { display: flex; gap: 28px; align-items: flex-start; position: relative; padding-right: 90px; padding-bottom: 20px; }
#arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
.col h3 { margin: 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.frame { background: var(--frame); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.frame.top { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.frame > .ttl { font-weight: 600; margin-bottom: 4px; }
.frame > .ttl small { font-weight: 400; color: var(--muted); }
.var { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
.var .nm { font: 13px var(--mono); white-space: nowrap; cursor: pointer; }
.var .nm:hover { color: var(--accent); }
.var .kd { color: var(--muted); font-size: 11px; }
.val { font: 13px var(--mono); }
.sc { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; display: inline-block; }
.g { color: var(--bad); font-style: italic; }
.box { border: 1px solid var(--line); border-radius: 6px; display: inline-block; vertical-align: top; }
.box > .hd { font-size: 11px; color: var(--muted); padding: 1px 6px; cursor: pointer; user-select: none; }
.box > .hd::before { content: "\25BE "; }
.box.closed > .hd::before { content: "\25B8 "; }
.box.closed > .bd { display: none; }
.rec { background: var(--rec); }
.rec > .bd { padding: 2px 6px 4px; }
.rec .fld { display: flex; gap: 6px; padding: 1px 0; align-items: flex-start; }
.rec .fld > .fn { color: var(--muted); font: 12px var(--mono); min-width: 3em; }
.arr { background: var(--arr); }
.arr > .bd { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px 4px 4px; max-width: 900px; }
.cell { display: flex; flex-direction: column; align-items: center; }
.cell > .ix { font-size: 10px; color: var(--muted); }
.ptr { display: inline-block; min-width: 18px; text-align: center; border: 1px solid var(--ptr); color: var(--ptr);
	border-radius: 4px; padding: 0 4px; font: 12px var(--mono); }
.ptr.nil { border-color: var(--line); color: var(--muted); }
.ptr.bad { border-color: var(--bad); color: var(--bad); }
.heapblk { background: var(--heap); border: 1px solid var(--ptr); border-radius: 8px; padding: 4px 6px; }
.heapblk .ttl { font: 11px var(--mono); color: var(--muted); }
.sel { outline: 2px solid var(--curline); outline-offset: 1px; }
/* what the last step changed */
@keyframes flash { from { background: var(--curline); } to { background: var(--chg); } }
.chg, tr.chg td, #hex .b.chg { background: var(--chg) !important; animation: flash 0.8s ease-out; }
.box > .hd.chg { color: var(--ink); }
.heapblk.chg { box-shadow: 0 0 0 2px var(--curline); }
table { border-collapse: collapse; font: 12px var(--mono); }
th, td { border-bottom: 1px solid var(--line); padding: 2px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
tr.fr td { background: var(--chip); font-family: system-ui, sans-serif; font-weight: 600; }
tr.ret td { color: var(--accent); }
tr.hl td { background: var(--cur); }
.tabs button.pop { border-radius: 6px; border-bottom: 1px solid var(--line); padding: 2px 7px; margin-right: 6px; font-size: 12px; }
#together { margin-left: auto; }
#together.on { background: var(--accent); color: #fff; }
#right.all .tabs button[data-tab] { background: var(--chip); color: var(--ink); border-color: var(--line); }
#right.all .panes { display: flex; flex-direction: row; }
#right.all .pane { display: block; flex: 1 1 0; min-width: 0; border-left: 1px solid var(--line); }
#right.all #data.on, #right.all #data { display: block; }
#right.all #datacols { flex-wrap: wrap; }
.panes { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.panes > .pane { flex: 1; }
body.popout main { grid-template-columns: 1fr; }
body.popout #left, body.popout .tabs, body.popout header button, body.popout header label { display: none; }
#bye { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center;
	flex-direction: column; gap: 8px; font-size: 18px; z-index: 10; }
#bye.on { display: flex; }
#mem.on { display: flex; flex-direction: column; overflow: hidden; }
#right.all #mem { display: flex; flex-direction: column; overflow: hidden; }
#memlist { display: flex; gap: 12px; align-items: stretch; flex: 1; min-height: 0; }
#memlist .regions { min-width: 210px; max-width: 260px; overflow: auto; }
#dumpcol { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#hexwrap { flex: 1; overflow: auto; position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
#hexspace { position: relative; }
#hex { position: absolute; left: 0; top: 0; right: 0; }
#hex > div { height: 18px; line-height: 18px; padding-left: 6px; }
#hex .sep { color: var(--muted); font-style: italic; background: var(--chip); }
#hex .own0 { background: rgba(31, 95, 191, 0.07); }
#hex .own1 { background: rgba(46, 125, 50, 0.08); }
#hex .nm { color: var(--accent); }
#hex .old { opacity: 0.45; }
#hex .spm { color: var(--bad); font-weight: 600; }
.refchip { display: inline-block; border: 1px dashed var(--accent); color: var(--accent); border-radius: 4px;
	padding: 0 5px; font: 12px var(--mono); cursor: help; }
#memlist .regions div.item { cursor: pointer; padding: 1px 4px; border-radius: 3px; font: 12px var(--mono); }
#memlist .regions div.item:hover, #memlist .regions div.item.on { background: var(--cur); }
#memlist .regions h4 { margin: 8px 0 2px; font-size: 12px; color: var(--muted); }
#hex { font: 12px/1.5 var(--mono); white-space: pre; }
#hex .b { padding: 0 1px; }
#hex .on { background: var(--cur); }
#hex .ad { color: var(--muted); }
.help { color: var(--muted); font-size: 12px; }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
</style>
</head>
<body>
<header>

<main>
	<section id="left">

		</div>
	</section>
	<section id="right">
		<div class="tabs">
			<button data-tab="data" class="on" data-t="Datos">Datos</button><button class="pop" data-pop="data" data-tt="Abrir Datos en otra ventana">⧉</button>

	</section>
</main>

const MAXSTR = 40;	/* longer strings are cut in Datos */

function L(text, ...args) {

}
function drawDump() {
	const wrap = $('#hexwrap'), h = $('#hex');
	if (!wrap) return;
	$('#hexspace').style.height = (memRows * ROWH) + 'px';
	const first = Math.max(0, Math.floor(wrap.scrollTop / ROWH) - 5), last = Math.min(memRows, first + Math.ceil(wrap.clientHeight / ROWH) + 10);
	h.style.top = (first * ROWH) + 'px';
	h.textContent = '';
	const sel = selected ? [[selected.a, selected.s]] : [];
	for (let i = first; i < last; i++) {
		const r = rowAt(i), line = el('div');
		if (!r) continue;
		if (r.g.gap != null) {
			line.className = 'sep';
			line.textContent = L('   … {0} bytes de pila sin usar …', r.g.gap);
			h.append(line);
			continue;
		}
		const base = r.g.a + r.i * 16;
		const spRow = memSp >= base && memSp < base + 16;
		if (spRow) {
			const m = el('span', 'spm', 'sp ▶');
			m.title = L('Puntero de pila: lo que hay después ya no se usa, pero los bytes siguen ahí');
			line.append(m, el('span', 'ad', hex(base).padStart(6, ' ') + '  '));
		} else {
			line.append(el('span', 'ad', hex(base).padStart(10, ' ') + '  '));
		}
		let ascii = '', label = '', spHere = false;
		for (let k = 0; k < 16; k++) {
			const a = base + k;
			if (a >= r.g.b) { line.append(el('span', 'b', '   ')); continue; }
			needChunk(a);
			const by = byteAt(a) || '··';
			const o = ownerIndex(a);
			let cls = 'b';
			if (o >= 0) { cls += ' own' + (o % 2); if (memItems[o].a === a) label += (label ? ', ' : '') + memItems[o].n; }
			if (inRanges(a, sel)) cls += ' on';
			if (memSp && a >= memSp && a >= memStack) cls += ' old';
			if (a === memSp) spHere = true;
			if (inRanges(a, changedRanges)) cls += ' chg';
			const b = el('span', cls, by + ' ');
			if (o >= 0) b.title = memItems[o].n + ' (' + hex(memItems[o].a) + ', ' + memItems[o].s + ' bytes)';
			line.append(b);
			const c = parseInt(by, 16);
			ascii += c >= 32 && c < 127 ? String.fromCharCode(c) : '.';
		}
		line.append(el('span', 'ad', ' ' + ascii.padEnd(16, ' ') + ' '), el('span', 'nm', label));
		if (spHere) line.append(el('span', 'spm', L('  ◀ puntero de pila (sp)')));
		h.append(line);
	}
}
function memScrollTo(addr, force) {
	const wrap = $('#hexwrap'), row = rowOf(addr), top = row * ROWH;
	if (force || top < wrap.scrollTop || top + ROWH > wrap.scrollTop + wrap.clientHeight)
		wrap.scrollTop = Math.max(0, top - wrap.clientHeight / 3);
}
function renderMem() {
	const s = state.snap, list = $('#memlist .regions');
	list.textContent = '';
	if (!s) { list.append(el('div', 'help', L('El programa no está parado.'))); return; }
	if (chunkVer !== version) { chunks = new Map(); chunkVer = version; }
	const items = [];
	const add = (title, its) => {
		list.append(el('h4', null, title));
		its.forEach(it => {
			const d = el('div', 'item', hex(it.a) + '  ' + it.n + ' (' + it.s + ')');
			if (selected && selected.a === it.a && selected.n === it.n) d.classList.add('on');
			d.onclick = () => { select(it); memScrollTo(it.a, true); };
			list.append(d);
			items.push(it);
		});
	};
	add(L('Variables globales'), s.gslots);
	s.frames.slice().reverse().forEach(f => add(L('Pila: {0}', frameName(f)), (f.ret ? [{ a: f.ret.a, s: 16, n: L('retorno y fp guardado') }] : []).concat([...f.slots].sort((a, b) => a.a - b.a))));
	add(L('Memoria dinámica'), s.heap.map(h => ({ a: h.a, s: h.s, n: '^' + h.t })));
	memItems = items.slice().sort((a, b) => a.a - b.a);
	memLayout(s);
	$('#memttl').textContent = L('Toda la memoria en uso: variables globales y pila, y después la memoria dinámica. Lo resaltado en naranja ha cambiado en el último paso. Lo atenuado está por encima del puntero de pila (sp): ya no se usa, pero sus bytes siguen ahí.');
	if (memFollow && changedRanges.length) {
		memFollow = false;
		requestAnimationFrame(() => { drawDump(); memScrollTo(changedRanges[0][0]); drawDump(); });
	} else {
		requestAnimationFrame(drawDump);
	}
}
$('#hexwrap').addEventListener('scroll', () => requestAnimationFrame(drawDump));
window.addEventListener('resize', () => requestAnimationFrame(drawDump));

/* tabs, pop-out windows, side by side */
const VIEW = new URLSearchParams(location.search).get('view');
const shown = name => VIEW ? VIEW === name : ($('#right').classList.contains('all') || $('#' + name).classList.contains('on'));
function showTab(name) {
	if (VIEW || $('#right').classList.contains('all')) { if (name === 'mem') renderMem(); return; }
	document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
	document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === name));
	if (name === 'data') drawArrows();
}
document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.onclick = () => { showTab(b.dataset.tab); if (b.dataset.tab === 'mem') renderMem(); if (b.dataset.tab === 'stack') renderStack(); if (b.dataset.tab === 'files') renderFiles(); });
const popups = {};
document.querySelectorAll('.tabs button[data-pop]').forEach(b => b.onclick = () => {
	popups[b.dataset.pop] = window.open(location.pathname + '?t=' + T + '&lang=' + LANG + '&view=' + b.dataset.pop, 'pascdb-' + b.dataset.pop, 'width=900,height=700');
});
function closePopups() {
	for (const w of Object.values(popups)) {
		try { if (w && !w.closed) w.close(); } catch (e) { }
	}
}
$('#together').onclick = () => {
	const r = $('#right'), on = !r.classList.contains('all');
	r.classList.toggle('all', on);
	$('#together').classList.toggle('on', on);
	if (!on) showTab('data');
	renderAll();
};
function renderAll() {
	if (shown('data')) renderData();
	if (shown('stack')) renderStack();
	if (shown('mem')) renderMem();
	if (shown('files')) renderFiles();
}
/* input files, with what has been read so far and the read position */
function renderFiles() {
	const pane = $('#files');
	pane.textContent = '';
	const s = state.snap;
	if (!s) { pane.append(el('div', 'help', L('El programa no está parado.'))); return; }
	pane.append(el('p', 'help', L('Ficheros abiertos para leer. Lo ya leído aparece atenuado y el siguiente carácter que se leerá, resaltado.')));
	if (!s.files || !s.files.length) { pane.append(el('div', 'help', L('No hay ficheros abiertos para leer.'))); return; }
	let target = null;
	for (const f of s.files) {
		const box = el('div', 'infile');
		const at = f.pos >= f.size ? (f.more ? L('esperando más entrada') : L('fin de fichero (eof)')) : L('posición {0} de {1}', f.pos, f.size);
		box.append(el('h4', null, (f.std ? L('entrada estándar (input)') : f.name) + ' — ' + at));
		const pre = el('pre');
		const rel = f.pos - f.start, t = f.text;
		const vis = c => c === '\n' ? '↵\n' : c;
		const done = el('span', 'done');
		done.textContent = t.slice(0, Math.max(0, rel)).replace(/\n/g, '↵\n');
		pre.append(done);
		const here = el('span', 'here', rel < t.length ? vis(t[rel]) : ' ');
		here.title = L('Siguiente carácter que se leerá');
		pre.append(here, document.createTextNode(t.slice(rel + 1).replace(/\n/g, '↵\n')));
		box.append(pre);
		pane.append(box);
		if (!target) target = { pre, here };
		requestAnimationFrame(() => {
			const pb = pre.getBoundingClientRect(), hb = here.getBoundingClientRect();
			if (hb.top < pb.top || hb.bottom > pb.bottom) pre.scrollTop += hb.top - pb.top - pre.clientHeight / 3;
		});
	}
}
/* windows of the same session share the selected variable */
const chan = window.BroadcastChannel ? new BroadcastChannel('pascdb-' + T) : null;
function select(it) {
	selected = it;
	if (chan) chan.postMessage(it);
	if (!VIEW && !$('#right').classList.contains('all')) showTab('mem');
	if (shown('mem')) { renderMem(); requestAnimationFrame(() => { memScrollTo(it.a, true); drawDump(); }); }
}
if (chan) chan.onmessage = e => {
	if (e.data && e.data.quit) { gone = true; bye(); return; }
	if (e.data && e.data.lang) { LANG = e.data.lang; applyLang(); if (state) { renderStatus(); renderAll(); } return; }
	selected = e.data;
	if (shown('mem')) { renderMem(); requestAnimationFrame(() => { memScrollTo(selected.a, true); drawDump(); }); }
};
if (VIEW) {
	document.body.classList.add('popout');
	document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === VIEW));
	document.title = 'pascdb: ' + L(({ data: 'Datos', stack: 'Pila', mem: 'Memoria', files: 'Ficheros' })[VIEW] || VIEW);
}
function renderStatus() {
	const st = $('#status'), names = { paused: 'parado', running: 'ejecutando', input: 'esperando entrada', finished: 'terminado', starting: 'empezando' };
	let t = '<b>' + L(names[state.status] || state.status) + '</b>';
	if (state.snap) t += L(' · línea {0}, columna {1}', state.snap.line, state.snap.col);
	if (state.status === 'finished') t += L(' · código de salida {0}', state.exitcode);
	st.innerHTML = t;
	$('#play').textContent = state.mode === 'play' ? L('⏸ Pausa') : L('▶ Reproducir');
	$('#inrow').classList.toggle('waiting', state.status === 'input');
	if (state.status === 'input') $('#input').focus();
	const out = $('#out');
	const atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
	out.textContent = state.output;
	if (state.messages) out.append(el('span', 'msg', (state.output && !state.output.endsWith('\n') ? '\n' : '') + state.messages));
	if (atEnd) out.scrollTop = out.scrollHeight;
	$('#speedv').textContent = (state.delay).toFixed(2) + ' s';
}
async function poll() {
	for (;;) {
		if (gone) return;
		try {
			const s = await api('state', { since: version });
			if (s.status === 'quit') { gone = true; bye(); return; }
			if (s.version !== version) {
				const oldSnap = state ? state.snap || null : null;
				const newSnap = JSON.stringify(s.snap || null) !== JSON.stringify(oldSnap);
				if (newSnap) diff(oldSnap, s.snap || null);
				state = s;
				version = s.version;
				renderStatus();
				markSource();
				if (newSnap) renderAll();
			}
		} catch (e) {
			if (gone) return;
			/* a pop-out window whose pascdb has ended closes itself */
			if (VIEW) { gone = true; bye(); return; }
			$('#status').textContent = L('pascdb no responde (¿lo has cerrado?)');
			await new Promise(r => setTimeout(r, 2000));
		}
	}
}
$('#step').onclick = () => api('step');
$('#play').onclick = () => api(state && state.mode === 'play' ? 'pause' : 'play');
$('#run').onclick = () => api('run');
$('#restart').onclick = () => { closed.clear(); api('restart'); };
$('#lang').onclick = () => {
	LANG = LANG === 'en' ? 'es' : 'en';
	try { localStorage.setItem('pascdb-lang', LANG); } catch (e) { }
	if (chan) chan.postMessage({ lang: LANG });
	applyLang();
	if (state) { renderStatus(); renderAll(); }
};
function bye() {
	closePopups();
	$('#bye').classList.add('on');
	window.close();	/* works for windows pascdb opened, ignored otherwise */
}
let gone = false;
$('#quit').onclick = () => { gone = true; if (chan) chan.postMessage({ quit: true }); api('quit').catch(() => {}).finally(bye); };
$('#speed').oninput = e => api('speed', { delay: e.target.value / 1000 });
$('#input').onkeydown = e => { if (e.key === 'Enter') { api('input', { text: e.target.value }); e.target.value = ''; } };
$('#eof').onclick = () => api('eof');
$('#data').addEventListener('scroll', drawArrows);
document.addEventListener('keydown', e => {
	if (e.target.tagName === 'INPUT') return;
	if (e.key === 'Enter' || e.key === 'F10') { e.preventDefault(); api('step'); }
	else if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
});
api('source').then(s => { lines = s.lines; $('#fname').textContent = s.fname; renderSource(); poll(); });
</script>
